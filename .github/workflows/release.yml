name: Release multiplataforma

on:
  # Tag empujado a mano (git push origin vX.Y.Z)...
  push:
    tags:
      - 'v*'
  # ...o llamado por auto-version.yml tras crear el tag automáticamente.
  # (Un tag creado con GITHUB_TOKEN no dispara el evento `push`, por eso
  # se invoca así y nunca se construye dos veces.)
  workflow_call:
    inputs:
      tag:
        description: Tag a construir (vX.Y.Z)
        type: string
        required: true
  # Reintentar a mano un release que falló (Actions -> Release multiplataforma
  # -> Run workflow), indicando el tag ya creado, p. ej. v1.8.0.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag a publicar (vX.Y.Z)
        type: string
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: linux
            os: ubuntu-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - name: Install dependencies
        run: flutter pub get

      # Firma de release: sin estos secretos el APK sale firmado con la clave
      # de depuración y NO se puede instalar encima de una versión firmada.
      # Secretos: ANDROID_KEYSTORE_BASE64 (base64 del .jks), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Configurar firma Android
        if: matrix.target == 'android'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK se firmará con la clave de depuración."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/nexo-release.jks
          {
            echo "storeFile=nexo-release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=${KEY_ALIAS:-nexo}"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties

      # Universal solo con ARM (x86_64 es de emuladores: tiene su propio APK).
      # --obfuscate/--split-debug-info quitan ~1,5 MB por arquitectura; los
      # símbolos quedan como artefacto privado para descifrar errores con
      # `flutter symbolize`.
      - name: Build Android
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols/universal
          cp build/app/outputs/flutter-apk/app-release.apk universal.apk
          flutter build apk --split-per-abi --release --obfuscate --split-debug-info=build/symbols/split
          mkdir -p dist
          mv universal.apk dist/nexo-${{ env.TAG }}-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/nexo-${{ env.TAG }}-armv7.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/nexo-${{ env.TAG }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/nexo-${{ env.TAG }}-x86_64.apk

      - name: Build Windows
        if: matrix.target == 'windows'
        run: |
          flutter build windows --release
          mkdir -p dist
          ./installer/build_installer.ps1 -ReleaseDir "build/windows/x64/runner/Release" -OutFile "dist/nexo-${{ env.TAG }}-setup-x64.exe" -ZipOutFile "dist/nexo-${{ env.TAG }}-windows-x64.zip"
          ./scripts/verify_windows_bundle.ps1 -Installer "dist/nexo-${{ env.TAG }}-setup-x64.exe" -Zip "dist/nexo-${{ env.TAG }}-windows-x64.zip"
          ./scripts/scan_windows_release.ps1 -Path @("dist/nexo-${{ env.TAG }}-setup-x64.exe", "dist/nexo-${{ env.TAG }}-windows-x64.zip")
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt

      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          mkdir -p dist
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../dist/nexo-${{ env.TAG }}-linux-x64.tar.gz *
          cd ../../../../../

      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r ../../../../../dist/nexo-${{ env.TAG }}-macos.zip nexo.app
          cd ../../../../../

      # iOS se compila solo para pruebas: sin firma de Apple no se instala en
      # un iPhone normal, así que NO se publica en el release. El .ipa queda
      # como artefacto privado de la ejecución (Actions -> la ejecución ->
      # Artifacts -> dist-ios) para instalarlo con Sideloadly/AltStore.
      - name: Build iOS (Unsigned)
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../dist/nexo-${{ env.TAG }}-ios-unsigned.ipa Payload
          cd ../../../

      - name: Guardar símbolos de Android
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v6
        with:
          name: symbols-android-${{ env.TAG }}
          path: build/symbols
          if-no-files-found: error
          retention-days: 90

      # Cada plataforma deja sus archivos como artefacto; el release se
      # publica una sola vez al final con todo junto (así el actualizador de
      # la app nunca ve un release a medio subir).
      - name: Guardar artefactos
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar release en Auralix-Studio/nexo
    needs: build
    # Publica aunque falle una plataforma secundaria (iOS, macOS, Linux):
    # lo imprescindible (Android y Windows) se verifica abajo.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Comprobar el token de publicación
        env:
          ORG_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
        run: |
          if [ -z "$ORG_TOKEN" ]; then
            echo "::error title=Falta ORG_GITHUB_TOKEN::Crea un token con permiso Contents: Read and write sobre Auralix-Studio/nexo y guárdalo como secreto ORG_GITHUB_TOKEN en nexo-code (Settings -> Secrets and variables -> Actions). Ver docs/versionado.md."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ORG_TOKEN" https://api.github.com/repos/Auralix-Studio/nexo)
          if [ "$code" != "200" ]; then
            echo "::error title=ORG_GITHUB_TOKEN sin acceso::El token no puede leer Auralix-Studio/nexo (HTTP $code). Revisa que no haya vencido y que incluya ese repositorio."
            exit 1
          fi

      - id: v
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Reunir artefactos
        uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verificar lo imprescindible
        run: |
          for f in "nexo-${TAG}-universal.apk" "nexo-${TAG}-setup-x64.exe" "nexo-${TAG}-windows-x64.zip"; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::Falta dist/$f: no se publica un release sin Android y Windows."
              exit 1
            fi
          done
          ls -la dist

      # Igual que build_release.ps1 + generate_release_notes.ps1.
      - name: Hashes, notas y metadatos
        run: |
          python3 scripts/release_assets.py sums dist
          python3 scripts/release_assets.py notes dist "${TAG}"
          python3 scripts/release_assets.py manifest dist "${TAG}"
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      # Copias con nombre fijo (sin versión) para enlazar desde la web:
      # https://github.com/Auralix-Studio/nexo/releases/latest/download/nexo-android.apk
      # siempre descarga la última versión, sin pasar por la API de GitHub.
      - name: Copias con nombre estable
        run: |
          mkdir -p dist/latest
          copy() { [ -f "dist/nexo-${TAG}-$1" ] && cp "dist/nexo-${TAG}-$1" "dist/latest/$2" || echo "::warning::Falta nexo-${TAG}-$1"; }
          copy universal.apk      nexo-android.apk
          copy arm64.apk          nexo-android-arm64.apk
          copy armv7.apk          nexo-android-armv7.apk
          copy x86_64.apk         nexo-android-x86_64.apk
          copy setup-x64.exe      nexo-windows-setup.exe
          copy windows-x64.zip    nexo-windows-x64.zip
          copy macos.zip          nexo-macos.zip
          copy linux-x64.tar.gz   nexo-linux-x64.tar.gz
          ls -la dist/latest

      - name: Crear release
        uses: softprops/action-gh-release@v3
        with:
          repository: Auralix-Studio/nexo
          tag_name: ${{ env.TAG }}
          name: Nexo ${{ steps.v.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/latest/*
            dist/*.apk
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS*.txt
            dist/version.json
          fail_on_unmatched_files: false
          token: ${{ secrets.ORG_GITHUB_TOKEN }}

      - name: Guardar release-meta.json y version.json
        uses: actions/upload-artifact@v6
        with:
          name: release-meta
          path: |
            dist/release-meta.json
            dist/version.json

  site:
    name: Actualizar sitio (changelog)
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          path: code

      # Igual que update_site.ps1 -Push: agrega la versión a CHANGELOG.md y
      # changelog.html del repo público; su workflow de Pages lo despliega.
      - uses: actions/checkout@v5
        with:
          repository: Auralix-Studio/nexo
          token: ${{ secrets.ORG_GITHUB_TOKEN }}
          path: site

      # version.json va al sitio recién ahora, con el release ya publicado:
      # la app nunca ve una versión cuyos archivos aún no existen.
      - uses: actions/download-artifact@v7
        with:
          name: release-meta
          path: meta

      - name: Agregar la versión al sitio
        run: |
          python3 code/scripts/release_assets.py site site "${TAG}" --date "$(TZ=America/Lima date +%F)"
          cp meta/version.json site/version.json
          cd site
          git add version.json
          if git diff --quiet HEAD; then
            echo "El sitio ya estaba al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: actualizar sitio para ${TAG}"
          git push
