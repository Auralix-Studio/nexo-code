name: Multi-Platform Release

on:
  # Tag empujado a mano (git push origin vX.Y.Z)...
  push:
    tags:
      - 'v*'
  # ...o llamado por auto-version.yml tras crear el tag automáticamente.
  # (Un tag creado con GITHUB_TOKEN no dispara el evento `push`, por eso
  # se invoca así y nunca se construye dos veces.)
  workflow_call:
    inputs:
      tag:
        description: Tag a construir (vX.Y.Z)
        type: string
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: linux
            os: ubuntu-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - name: Install dependencies
        run: flutter pub get

      # Firma de release: sin estos secretos el APK sale firmado con la clave
      # de depuración y NO se puede instalar encima de una versión firmada.
      # Secretos: ANDROID_KEYSTORE_BASE64 (base64 del .jks), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Configurar firma Android
        if: matrix.target == 'android'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK se firmará con la clave de depuración."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/nexo-release.jks
          {
            echo "storeFile=nexo-release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=${KEY_ALIAS:-nexo}"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties

      - name: Build Android
        if: matrix.target == 'android'
        run: |
          flutter build apk --release
          flutter build apk --split-per-abi --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nexo-${{ env.TAG }}-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/nexo-${{ env.TAG }}-armv7.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/nexo-${{ env.TAG }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/nexo-${{ env.TAG }}-x86_64.apk

      - name: Build Windows
        if: matrix.target == 'windows'
        run: |
          flutter build windows --release
          mkdir -p dist
          ./installer/build_installer.ps1 -ReleaseDir "build/windows/x64/runner/Release" -OutFile "dist/nexo-${{ env.TAG }}-setup-x64.exe" -ZipOutFile "dist/nexo-${{ env.TAG }}-windows-x64.zip"
          ./scripts/verify_windows_bundle.ps1 -Installer "dist/nexo-${{ env.TAG }}-setup-x64.exe" -Zip "dist/nexo-${{ env.TAG }}-windows-x64.zip"
          ./scripts/scan_windows_release.ps1 -Path @("dist/nexo-${{ env.TAG }}-setup-x64.exe", "dist/nexo-${{ env.TAG }}-windows-x64.zip")
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt

      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          mkdir -p dist
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../dist/nexo-${{ env.TAG }}-linux-x64.tar.gz *
          cd ../../../../../

      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r ../../../../../dist/nexo-${{ env.TAG }}-macos.zip nexo.app
          cd ../../../../../

      - name: Build iOS (Unsigned)
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../dist/nexo-${{ env.TAG }}-ios-unsigned.ipa Payload
          cd ../../../

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          repository: Auralix-Studio/nexo
          tag_name: ${{ env.TAG }}
          name: Nexo ${{ env.TAG }}
          files: dist/*
          token: ${{ secrets.ORG_GITHUB_TOKEN }}

  notes:
    name: Notas del release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Extraer notas del CHANGELOG
        run: python3 scripts/auto_version.py notes "${TAG}" > RELEASE_NOTES.md
      - name: Publicar notas
        uses: softprops/action-gh-release@v2
        with:
          repository: Auralix-Studio/nexo
          tag_name: ${{ env.TAG }}
          name: Nexo ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          token: ${{ secrets.ORG_GITHUB_TOKEN }}
