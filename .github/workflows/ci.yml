name: CI

# Corre los tests en cada PR para saber antes de fusionar si el
# versionado automático (que exige tests en verde) va a publicar.
on:
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter test
        run: |
          set +e
          flutter test --machine > test-results.jsonl
          python3 scripts/test_report.py test-results.jsonl
      - name: Vista previa de la versión
        if: github.base_ref == 'main'
        run: |
          git fetch --quiet --tags --unshallow origin || git fetch --quiet --tags origin
          {
            echo "### Al fusionar este PR se publicaría:"
            python3 scripts/auto_version.py next
          } >> "$GITHUB_STEP_SUMMARY"
