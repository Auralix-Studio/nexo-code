name: Versionado automático

# Cada vez que algo llega a `main` (un PR fusionado o un push directo):
#   1. corre los tests; si fallan, no se publica nada;
#   2. decide la versión según los commits (feat -> minor, fix -> patch,
#      "!" o BREAKING CHANGE -> major; docs/ci/test solos no publican);
#   3. actualiza pubspec.yaml, lib/core/config.dart y CHANGELOG.md,
#      hace commit "chore(release): vX.Y.Z" y crea el tag;
#   4. lanza el build multiplataforma y publica el release.
#
# También se puede lanzar a mano desde Actions -> "Versionado automático"
# para forzar patch/minor/major.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de versión
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Dos merges seguidos no deben calcular la misma versión a la vez.
concurrency:
  group: auto-version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Tests
    # El propio commit de release no vuelve a disparar una versión.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  version:
    name: Calcular versión y etiquetar
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.bump.outputs.release }}
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Calcular y aplicar versión
        id: bump
        run: |
          python3 scripts/auto_version.py apply --bump "${{ inputs.bump || 'auto' }}" \
            --date "$(TZ=America/Lima date +%F)" | tee -a "$GITHUB_OUTPUT"

      - name: Commit y tag
        if: steps.bump.outputs.release == 'true'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/core/config.dart CHANGELOG.md
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "Nexo ${TAG#v}"
          git push origin HEAD:main
          git push origin "${TAG}"

      - name: Resumen
        run: |
          if [ "${{ steps.bump.outputs.release }}" = "true" ]; then
            echo "### Nueva versión ${{ steps.bump.outputs.tag }} (${{ steps.bump.outputs.bump }})" >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/auto_version.py notes "${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sin cambios publicables: no se creó versión." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Build y publicación
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
